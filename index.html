<script>
const pages = {
  home: "Visão geral",
  promote: "Promover",
  ranks: "Hierarquia",
  history: "Histórico",
  audit: "Auditoria",
  accounts: "Contas"
};

// Navegação
document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    const page = button.dataset.page;

    document.querySelectorAll("nav button").forEach(item => {
      item.classList.remove("active");
    });

    document.querySelectorAll(".page").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    document.getElementById(page).classList.add("active");
    document.getElementById("heading").textContent = pages[page];
  });
});

// Hierarquia
const ranks = [
  "Criador", "Sub Criador", "Administrador", "Moderador",
  "Marechal", "Comandante", "Subcomandante", "Sócios",
  "Elite Real", "Elite Secreta", "Elite Militar",
  "General do Exército", "General de Divisão",
  "General de Brigada", "Coronel", "Tenente-Coronel",
  "Major", "Capitão", "Primeiro Tenente",
  "Segundo Tenente", "Aspirante a Oficial", "Cadete",
  "Subtenente", "Primeiro Sargento", "Segundo Sargento",
  "Terceiro Sargento", "Cabo", "Soldado", "Recruta"
];

const rankList = document.getElementById("rankList");

ranks.forEach((rank, index) => {
  const item = document.createElement("div");
  item.className = "rank";
  item.textContent = `${index + 1}. ${rank}`;
  rankList.appendChild(item);
});

// Consulta demonstrativa
function consultar() {
  const nickname = document.getElementById("nickname").value.trim();
  const result = document.getElementById("result");

  if (!nickname) {
    result.innerHTML = '<p class="muted">Digite o nickname do jogador.</p>';
    return;
  }

  result.innerHTML = `
    <div class="card">
      <h2>Jogador informado</h2>
      <p>${escapeHTML(nickname)}</p>
      <p class="muted">
        Consulta real indisponível: a API Roblox ainda não foi conectada.
      </p>
    </div>
  `;
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}
</script>
